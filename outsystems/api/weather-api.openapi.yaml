openapi: 3.0.3
info:
  title: SG Weather Insights API
  version: 1.0.0
  description: |
    Read-only REST API exposed by the `Weather_CS` module (exposed REST API `WeatherAPI`).
    Serves data already ingested from data.gov.sg, so it is not affected by upstream rate
    limits. Timestamps are Singapore local time.
servers:
  - url: https://{host}/Weather_CS/rest/WeatherAPI
    variables:
      host:
        default: your-environment.outsystemscloud.com
paths:
  /stations:
    get:
      operationId: GetStations
      summary: Latest value at every station for one metric, plus min/avg/max
      parameters:
        - { name: metric, in: query, required: true, schema: { $ref: "#/components/schemas/MetricCode" } }
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "400": { description: Unknown metric }
  /stations/{stationId}/readings:
    get:
      operationId: GetStationReadings
      parameters:
        - { name: stationId, in: path, required: true, schema: { type: string, pattern: "^S[0-9]{1,4}$" } }
        - { name: metric, in: query, required: true, schema: { $ref: "#/components/schemas/MetricCode" } }
        - { name: hours, in: query, schema: { type: integer, minimum: 1, maximum: 168, default: 24 } }
      responses:
        "200":
          description: Readings, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Point" }
        "400": { description: Unknown metric or hours out of range }
        "404": { description: Unknown station }
  /air-quality:
    get:
      operationId: GetAirQuality
      responses:
        "200":
          description: Latest 24-hour PSI and PM2.5 per region with NEA band
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AirQuality" }
components:
  schemas:
    MetricCode:
      type: string
      enum: [air-temperature, relative-humidity, wind-speed, rainfall]
    Snapshot:
      type: object
      required: [metric, unit, asOf, min, avg, max, stations]
      properties:
        metric: { $ref: "#/components/schemas/MetricCode" }
        unit: { type: string, example: "°C" }
        asOf: { type: string, example: "2026-10-20T16:03:00" }
        min: { type: number }
        avg: { type: number }
        max: { type: number }
        stations:
          type: array
          items:
            type: object
            required: [id, name, value]
            properties:
              id: { type: string, example: S109 }
              name: { type: string, example: Ang Mo Kio Avenue 5 }
              latitude: { type: number }
              longitude: { type: number }
              value: { type: number }
    Point:
      type: object
      required: [observedAt, value]
      properties:
        observedAt: { type: string, example: "2026-10-20T16:03:00" }
        value: { type: number }
    AirQuality:
      type: object
      required: [region, observedAt, psi24h, band, level]
      properties:
        region: { type: string, enum: [north, south, east, west, central] }
        observedAt: { type: string, example: "2026-10-20T16:03:00" }
        psi24h: { type: integer }
        pm25_24h: { type: integer }
        band: { type: string, enum: [Good, Moderate, Unhealthy, Very unhealthy, Hazardous] }
        level: { type: integer, minimum: 1, maximum: 5 }
