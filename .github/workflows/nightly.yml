name: nightly-upstream-contract

on:
  schedule:
    - cron: "17 22 * * *" # 06:17 SGT
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  contract-live:
    name: data.gov.sg still matches our schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-test.txt
      - run: pytest -m live tests/contract
        env:
          DGS_LIVE: "1"
          DGS_API_KEY: ${{ secrets.DGS_API_KEY }}
      - name: Open an issue on drift
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Upstream contract drift detected (${new Date().toISOString().slice(0,10)})`,
              body: `The nightly live contract run failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nCheck DGS_IS normalisation before the next sync breaks.`,
              labels: ['upstream-drift'],
            });
