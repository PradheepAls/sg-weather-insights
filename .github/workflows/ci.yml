name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 22 * * *" # 06:17 SGT: check data.gov.sg still matches our schemas
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Contract, rules and API-spec tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-test.txt
      - run: ruff check tests
      - name: Offline tests (fixtures, vectors, OpenAPI)
        run: pytest -m "not live and not integration"
      - name: Live upstream contract (scheduled / manual runs)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pytest -m live tests/contract
        env:
          DGS_LIVE: "1"
          DGS_API_KEY: ${{ secrets.DGS_API_KEY }}
      - name: API tests against the deployed app (when configured)
        if: vars.WEATHER_API_BASE_URL != ''
        run: pytest -m integration
        env:
          WEATHER_API_BASE_URL: ${{ vars.WEATHER_API_BASE_URL }}

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Run against the deployed app (when configured)
        if: vars.WEATHER_APP_URL != ''
        env:
          WEATHER_APP_URL: ${{ vars.WEATHER_APP_URL }}
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
