name: iac

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/iac.yml", ".checkov.yaml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/iac.yml", ".checkov.yaml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: infra/terraform

jobs:
  terraform:
    name: fmt, validate, test, tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: terraform test
        shell: bash
        run: |
          set +e
          terraform test -no-color > test.log 2>&1; rc=$?
          cat test.log
          if [ $rc -ne 0 ]; then
            # Surface failures as annotations so they show on the PR without opening the log.
            grep -E '^(Error|  run ".*"\.\.\. fail)' test.log | head -n 8 | while IFS= read -r l; do echo "::error title=terraform test::$l"; done
            echo "::error title=terraform test (detail)::$(grep -A12 '^Error' test.log | head -n 60 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          exit $rc
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.54.0
      - run: tflint --init && tflint --format compact

  checkov:
    name: Checkov security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          config_file: .checkov.yaml
