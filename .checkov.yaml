# Checkov configuration. Each skip has its reason; anything not listed fails the build.
compact: true
quiet: true
framework:
  - terraform
skip-path:
  - infra/terraform/tests
skip-check:
  # Enabled for Prod through variables and enforced by preconditions + terraform test.
  - CKV_AWS_150   # ALB deletion protection (is_production)
  - CKV_AWS_157   # RDS Multi-AZ (db_multi_az, required for Prod)
  - CKV_AWS_293   # RDS deletion protection (required for Prod)
  # Set on the launch template the instance is launched from; Checkov does not follow it.
  - CKV_AWS_79    # IMDSv2
  - CKV_AWS_8     # EBS encryption
  - CKV_AWS_126   # detailed monitoring
  - CKV_AWS_135   # EBS optimised
  - CKV2_AWS_41   # instance profile
  # Not applicable.
  - CKV_AWS_161   # RDS IAM authentication is not supported for SQL Server
  # Deliberately out of scope for this assessment (listed as next steps in the README).
  - CKV2_AWS_28   # WAF on the ALB
  - CKV_AWS_91    # ALB access logs
  - CKV2_AWS_11   # VPC flow logs
  - CKV_AWS_118   # RDS enhanced monitoring
  - CKV2_AWS_57   # automatic secret rotation (OutSystems servers must be reconfigured on rotation)
